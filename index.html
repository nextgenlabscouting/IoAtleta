<title>IoAtleta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0B1410; --panel:#111E17; --alto:#16281E;
  --line:rgba(239,234,224,.10); --line2:rgba(239,234,224,.20);
  --cream:#EFEAE0; --muted:#7C8B80;
  --orange:#FF6A2B; --green:#57A45F; --sand:#E8B04B; --rosso:#E8654B; --blu:#6F9FC4;
  --disp:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--body);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:0;height:0}
@keyframes pulse{0%,60%,100%{opacity:.22}30%{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes caret{0%,100%{opacity:1}50%{opacity:0}}
.fade{animation:up .24s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===================================================================
   LAYOUT — tre formati, nessun interruttore da toccare.
   Base = telefono. A 700px entra il tablet, a 1100px il computer:
   la barra delle sezioni passa da sotto a sinistra e le schede si
   dispongono su due colonne, così lo schermo largo non resta una
   striscia verticale in mezzo al vuoto.
   =================================================================== */
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding-top:env(safe-area-inset-top)}
.colonna{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0}
.wrap{max-width:660px;margin:0 auto;width:100%;padding:0 18px}

/* header: sul telefono è la testata, da tablet in su sparisce nella barra laterale */
.top{border-bottom:1px solid var(--line);flex-shrink:0}
.top .wrap{display:flex;align-items:center;gap:9px;padding-top:12px;padding-bottom:11px}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer}

.logo .mk{width:26px;height:26px}
.logo .lt{width:129px;height:18px}
.tagIA{border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.chip-esci{margin-left:auto;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px;padding:5px 12px}
.chip-esci:hover{color:var(--cream);border-color:var(--line2)}

/* titolo sezione */
.head{flex-shrink:0}
.head .wrap{display:flex;align-items:flex-end;gap:14px;padding-top:16px;padding-bottom:10px}
.num{width:40px;height:40px;flex-shrink:0;color:var(--acc);opacity:.9;display:flex;align-items:center}
.num svg{width:40px;height:40px}
h1{font-family:var(--disp);font-weight:700;font-size:27px;line-height:1;margin:0}
.tagline{color:var(--muted);font-size:13px;margin-top:4px}

/* ---- nota di sezione: titolo sempre intero, il resto si apre ----
   Prima era una riga tagliata a metà con i puntini: si leggeva
   l'inizio di una frase e nient'altro. Ora il titolo dice cosa c'è
   dentro e il testo completo arriva solo se lo chiedi. */
.notaW{flex-shrink:0;margin-bottom:12px}
.nota{background:var(--panel);border-left:2px solid var(--acc);border-radius:6px;overflow:hidden}
.nota>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 13px}
.nota>summary::-webkit-details-marker{display:none}
.nota>summary b{font-size:12px;font-weight:600;letter-spacing:.01em;color:var(--cream);line-height:1.4}
.nota>summary u{margin-left:auto;text-decoration:none;color:var(--muted);font-size:17px;line-height:.8;
  flex-shrink:0;transition:transform .22s ease}
.nota[open]>summary u{transform:rotate(45deg)}
.nota>summary:hover u{color:var(--cream)}
.nota .co{padding:0 13px 12px;color:var(--muted);font-size:12.5px;line-height:1.6;animation:up .2s ease both}

/* corpo scorrevole */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;padding-bottom:10px}

/* le schede vanno su più colonne solo dove sono davvero indipendenti */
.schede{display:block}
.nota.inline{margin:0 0 14px}

/* chat */
.msg{margin-bottom:18px}
.me{display:flex;justify-content:flex-end}
.me b{max-width:82%;background:var(--acc);color:var(--bg);border-radius:12px 12px 2px 12px;padding:11px 15px;
  font-size:15px;line-height:1.5;font-weight:500;white-space:pre-wrap}
.ai{padding-left:14px;border-left:2px solid var(--acc)}
.firma{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.firma span{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.04em;color:var(--acc)}
.firma em{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--muted);
  border:1px solid var(--line);border-radius:3px;padding:1px 4px}
.testo{font-size:15px;line-height:1.65;white-space:pre-wrap}
.dots{display:flex;gap:5px;padding:6px 0 2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:pulse 1.2s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}

.avvio{border:1px solid var(--line);border-left:3px solid var(--acc);background:var(--panel);border-radius:6px;
  padding:13px 15px;color:var(--cream);font-size:14px;line-height:1.45;text-align:left;width:100%;margin-bottom:9px}
.avvio:hover{border-color:var(--line2)}

/* scheda crisi */
.crisi{border:1px solid var(--line2);border-left:3px solid var(--rosso);background:var(--alto);border-radius:8px;
  padding:18px;margin-bottom:22px}
.crisi h3{font-family:var(--disp);font-weight:700;font-size:20px;margin:0 0 10px;line-height:1.15}
.crisi p{font-size:14.5px;line-height:1.65;margin:0 0 10px}
.tel{display:block;text-decoration:none;background:rgba(239,234,224,.05);border:1px solid var(--line);
  border-radius:6px;padding:11px 13px;margin-bottom:8px}
.tel .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tel .n{color:var(--cream);font-size:14px;font-weight:600}
.tel .v{color:var(--rosso);font-size:15px;font-weight:700;font-family:var(--disp);white-space:nowrap}
.tel .d{color:var(--muted);font-size:12px;margin-top:3px}
.mini{border:1px solid var(--line);border-left:3px solid var(--orange);background:var(--panel);border-radius:6px;
  padding:13px 15px;margin:14px 0}
.mini a{color:var(--orange);font-weight:700;font-family:var(--disp);font-size:15px;text-decoration:none}

/* barra scrittura */
.ask{flex-shrink:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}

/* ---- barra delle sezioni ----
   Un solo blocco nel documento: sul telefono si appoggia in basso
   come una tab bar, da tablet in su diventa la colonna di sinistra.
   Le icone hanno colori propri, quindi lo stato selezionato non lo
   dà la tinta ma il pieno: le altre restano indietro di opacità. */
.lato{order:2;flex-shrink:0;display:flex;flex-direction:column;background:var(--panel);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}

.marchio,.lato .profilo,.lato .sep{display:none}
.tabs{display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 1px 11px;
  border-top:2px solid transparent;position:relative;min-width:0;transition:border-color .18s ease,background .18s ease}
.tab b{display:block;width:23px;height:23px;opacity:.5;transition:opacity .18s ease}
.tab b svg{width:23px;height:23px;display:block}
.tab span{font-size:10.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"] b{opacity:1}
.tab[aria-selected="true"] span{color:var(--cream);font-weight:600}
.tab[aria-selected="true"]{border-top-color:var(--tc)}
.tab:hover b{opacity:.85}
.tab .bip{position:absolute;top:7px;right:26%;width:5px;height:5px;border-radius:50%;background:var(--tc)}

/* strumenti */

.card h2{font-family:var(--disp);font-weight:700;font-size:21px;margin:0 0 4px}
.card .sub{color:var(--muted);font-size:12.5px;line-height:1.55;margin:0 0 14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
label.f{display:block;margin-bottom:12px}
label.f b{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  font-weight:600;margin-bottom:5px}

  border-radius:8px;padding:11px 12px;font-size:16px;outline:none}
label.f input:focus,label.f select:focus{border-color:var(--blu)}
.btn{display:block;width:100%;background:var(--orange);color:var(--bg);border-radius:9px;padding:14px;
  font-weight:700;font-size:14.5px;text-align:center}
.btn.b2{background:var(--blu)}
.btn:disabled{opacity:.4;cursor:default}

.btn.ghost:hover{border-color:var(--line2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}

.pill{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12.5px;color:var(--muted);font-weight:500}

.barra{margin-bottom:10px}

.grafico{width:100%;height:auto;display:block;margin:8px 0 2px;overflow:visible}

.conta{display:flex;align-items:baseline;gap:10px;margin:4px 0 6px}

  border-bottom:2px solid var(--bg);transform:rotate(-45deg) translate(1px,-2px)}
.chk.fatto span{color:var(--muted)}

/* ---- schede pieghevoli ---- */
.pieg{padding:0;overflow:hidden}
.pieg>summary{list-style:none;cursor:pointer;display:flex;align-items:flex-start;gap:12px;padding:15px 16px}
.pieg>summary::-webkit-details-marker{display:none}

.pieg .ti{min-width:0;flex:1}

.pieg>summary u{margin-left:auto;text-decoration:none;color:var(--muted);font-size:21px;line-height:.8;
  flex-shrink:0;transition:transform .22s ease;padding-top:2px}

/* ---- pannello sviluppatore ---- */
.dev{position:fixed;inset:0;background:rgba(11,20,16,.96);z-index:90;overflow-y:auto;padding:22px 18px 40px}
.dev h3{font-family:var(--disp);font-weight:800;font-size:24px;margin:0 0 2px}
.dev .via{position:absolute;top:16px;right:16px;border:1px solid var(--line2);border-radius:999px;
  padding:6px 14px;font-size:13px;color:var(--muted)}
.dev .rg{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);
  align-items:baseline;font-size:13.5px}
.dev .rg span{color:var(--muted);font-size:11.5px}
.dev .rg b{font-family:var(--disp);font-size:15px;color:var(--orange)}

/* ---- accordion ---- */
.acc{border-top:1px solid var(--line)}
.acc:first-of-type{border-top:0}
.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 0}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary b{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.03em}
.acc>summary i{margin-left:auto;font-style:normal;color:var(--muted);font-size:19px;line-height:0;
  transition:transform .22s ease}
.acc[open]>summary i{transform:rotate(45deg)}
.acc .co{font-size:14.5px;line-height:1.65;white-space:pre-wrap;padding:0 0 15px}
.acc[open] .co{animation:up .22s ease both}

.btn,.pill,.chk,.avvio{transition:transform .12s ease}
.btn:active,.pill:active,.avvio:active{transform:scale(.975)}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--alto);border:1px solid var(--line2);
  border-radius:999px;padding:11px 18px;font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

/* ===================================================================
   TABLET — da 700px in su.
   La barra scende dal bordo inferiore al fianco sinistro e le schede

   spazio che c'è, ed è il motivo per cui non c'è niente da spiegare.

  .marchio .tagIA{font-size:9px;padding:1px 5px}

  .tabs{flex-direction:column;gap:3px;padding:0 9px}

  .tab[aria-selected="true"]{background:rgba(239,234,224,.07)}

  .lato .sep{display:block;flex:1}
  .lato .profilo{display:flex;align-items:center;justify-content:center;gap:7px;margin:12px 12px 0;

  /* Due colonne per le schede: sono blocchi indipendenti, non un discorso.

<script>
"use strict";

/* ===================================================================
   IoAtleta — versione che gira e basta.

   Il codice React che sta nel repository ha bisogno di Node, di un
   server, di una chiave API e di un deploy. Questa versione no: usa
   la capability sample, cioè chiede a Claude passando dall'account di
   chi apre la pagina. Nessuna chiave, nessun backend, nessun setup.

   In cambio c'è un vincolo: qui non esiste un parametro system con
   cache, quindi la conoscenza di ogni voce viaggia dentro il messaggio
   ed è compressa. I moduli completi (bromatologia, fisiologia,
   maturazione) restano nel repository per quando l'app verrà
   pubblicata davvero.
   =================================================================== */

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let toastT;
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2400); };

/* ---------- PROTOCOLLO DI SICUREZZA (gira sul telefono, prima dell'AI) ---------- */
const normalizza = (t) => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/[^\p{L}\p{N}\s]/gu, " ").replace(/\bnn\b/g, "non").replace(/\s+/g, " ").trim();
const compatta = (t) => normalizza(t).replace(/\s/g, "");

const CRISI = [/suicid/, /ammazzar(mi|si)/, /uccider(mi|si)/, /farla ?finita/,
  /non (voglio|riesco|ce la faccio)[^a-z]{0,12}(a )?(piu )?(a )?vivere/, /non (voglio|riesco a)[^a-z]{0,12}(piu )?esistere/,
  /meglio ?(se)? ?(morissi|sparissi|non ci fossi)/, /voglio morire/, /vorrei ?(essere)? ?mort/, /sparire per sempre/,
  /voglio sparire/, /tagliar(mi|si)/, /mi taglio/, /autolesion/, /farmi del male/, /farmi male apposta/,
  /sono un peso per/, /nessuno (si accorgerebbe|se ne accorgerebbe|noterebbe)/, /stare(i)? meglio senza di me/,
  /non ha piu senso niente/, /kill ?myself/, /want to die/, /self ?harm/];

const ALIM = [/vomit/, /non mangio (da|piu)/, /salto (i pasti|il pranzo|la cena|la colazione)/, /digiun/,
  /mi sento in colpa (quando|dopo) mangi/, /mi vedo (grasso|grassa|gonfio|gonfia)/,
  /devo dimagrire (subito|in fretta|assolutamente)/, /conto (tutte )?le calorie/, /brucio quello che (ho )?mangiat/,
  /mi alleno per compensare/, /odio il mio corpo/, /schifo il mio corpo/, /lassativ/, /abbuffat/, /mangio di nascosto/];

const USCITA = [/(voglio|voler|vorrei|volevo) morire/, /farla ?finita/, /ammazzarmi/, /uccidermi/, /farmi del male/];
const controlla = (t, lista) => { const n = normalizza(t), c = compatta(t); return lista.some((r) => r.test(n) || r.test(c)); };

/* ===================================================================
   I SEGNI DELLE SEZIONI
   Una famiglia, non sei icone prese in giro: stesso riquadro 24, stesso

  brief:`SEI IOATLETA FISICO.

DA SAPERE, e usalo invece di dire genericità.

Forza: prima del picco i guadagni sono neurali, i ragazzi reclutano il 78% delle unità motorie contro il 95% degli adulti; dopo il picco subentra l'ipertrofia (Radnor 2021). Effect size dell'allenamento di forza nei giovani 1,12, senza balzo puberale evidente (Behringer 2010).

Carico: sforzo percepito per minuti (Foster 2001). L'ACWR va abbandonato: accoppiamento matematico e uno studio randomizzato su 482 giovani calciatori senza alcun beneficio (Dalen-Lorentsen 2021). La regola del 10% non ha supporto sperimentale. Il dato solido: più ore settimanali di sport organizzato dell'età in anni raddoppia il rischio di infortunio grave (Jayanthi 2015).

MITI. Le finestre di allenabilità non esistono: la NSCA dice che la teoria è stata contestata per mancanza di dati longitudinali (Lloyd 2016) e il consensus CIO non trova evidenza che le risposte dipendano da età o maturazione. I pesi da giovane non bloccano la crescita (consensus internazionale 2014). Il VO2max in ml/kg/min è una fallacia statistica che favorisce i leggeri (Armstrong 2019). Gli organi tendinei del Golgi non sono un fusibile di sicurezza: hanno soglia bassa e nel movimento il feedback si riorganizza da inibitorio a eccitatorio (Chalmers 2002). La core stability centrata sul trasverso è ridimensionata: nessun muscolo singolo è determinante e la pressione intra-addominale aggiunge circa l'8% di rigidità (Lederman 2010). La velocità di conduzione nervosa non è 120 m/s: quello è il limite teorico, in vivo si misurano 45-70 m/s.

{ k:"mente", n:"03", t:"Mente", acc:"#EFEAE0", tag:"Pressione, testa, concentrazione",
  notaT:"Non è supporto psicologico", nota:"Uno spazio per ragionarci sopra. Non è supporto psicologico: quello lo fa uno psicologo iscritto all'Albo.",
  vai:["Perché dopo un pomeriggio di studio gioco peggio?","Perché nei momenti che contano mi si blocca tutto?","Il mister non mi fa giocare, come la vivo?"],
  brief:`SEI IOATLETA MENTE.

PRIMA DI TUTTO IL RESTO. Qui ascolti prima di spiegare. Se ti scrive che sta male, la prima risposta non è mai un meccanismo cerebrale: è aver capito cosa ha detto. Le neuroscienze che sai servono quando cambiano quello che fa, mai per fare colpo. Spiegare un disagio con un circuito lo rende più convincente e non più vero, ed è un effetto misurato: aggiungere neuroscienze irrilevanti fa sembrare buone le spiegazioni cattive (Weisberg et al., J Cogn Neurosci 2008). Se stai per nominare un'area del cervello, chiediti prima cosa cambia per lui.

DA SAPERE, e usalo invece di dire genericità.

TESTA E GAMBE, il legame che quasi nessuno gli dice, ed è il pezzo più utile che hai.
La fatica mentale peggiora il calcio, non solo la voglia. Trenta minuti di compito cognitivo prima di giocare hanno ridotto precisione e velocità dei passaggi e peggiorato le decisioni in campo (Smith et al., Med Sci Sports Exerc 2016). Novanta minuti di lavoro cognitivo hanno alzato lo sforzo percepito e tolto circa il 15% del tempo a esaurimento, a parità di cuore, lattato e ossigeno: cambiava solo quanto costava (Marcora et al., J Appl Physiol 2009). Il meccanismo non è chiuso: l'ipotesi dell'adenosina viene soprattutto da studi sulla caffeina e la revisione di Martin et al. 2018 la lascia aperta. Il dato pratico sta a monte del meccanismo: dopo cinque ore di scuola, un'interrogazione e due ore di studio non arrivi in campo come ci arriveresti la domenica mattina, e non è pigrizia. Serve a due cose: a non leggere una brutta seduta del giovedì come un calo di livello, e a mettere le cose pesanti dove reggono.
NON dire che lo sforzo mentale consuma le riserve di glucosio del cervello o esaurisce la forza di volontà: il modello dell'ego depletion non ha retto alla replica multi-laboratorio, effetto vicino a zero (Hagger et al., Perspect Psychol Sci 2016).

IL BLOCCO SOTTO PRESSIONE.
Il choking esiste ed è misurato. Le spiegazioni sono due e vanno riportate tutte e due: l'attenzione che si gira verso l'interno su un gesto ormai automatico (Beilock e Carr, J Exp Psychol Gen 2001) e la memoria di lavoro occupata dalla preoccupazione. Quello che si fa è uguale nei due casi: attenzione su un bersaglio fuori dal corpo. Il focus esterno è uno dei risultati più replicati dell'apprendimento motorio, centinaia di studi, e migliora sia come esegui sia quanto impari (Wulf, Int Rev Sport Exerc Psychol 2013). In concreto: pensa al punto dove vuoi che vada la palla, non alla caviglia che la calcia.

LO SGUARDO FERMO.
Il quiet eye è la fissazione stabile sul bersaglio nell'istante prima del gesto, ed è più lunga negli esperti; allenarlo funziona (Lebeau et al., Res Q Exerc Sport 2016, differenza esperti-principianti g 0,58). Il limite va detto: è studiato quasi tutto su gesti che parti tu, rigore, punizione, tiro libero, e molto meno nel gioco aperto. Nel calcio quindi vale sul piazzato, non su tutto, e perché funzioni è ancora discusso.

L'ANTICIPAZIONE SI ALLENA.
Chi legge il gioco in anticipo non ha riflessi migliori: raccoglie indizi prima, dalla postura, dalle spalle, dal piede d'appoggio. Si dimostra con l'occlusione temporale, cioè spegnendo il video prima del contatto: l'esperto indovina lo stesso, il principiante no (Williams e Abernethy). Non è un dono, è esposizione.
NON attribuirlo ai neuroni specchio: nell'uomo l'evidenza è indiretta e l'idea che leggano le intenzioni è contestata (Hickok 2014).

IL RESPIRO CHE HA UN TRIAL DIETRO.
Sospiro fisiologico: due inspirazioni dal naso, la seconda corta sopra la prima, poi una espirazione lunga dalla bocca. Cinque minuti al giorno per un mese hanno migliorato l'umore e abbassato la frequenza respiratoria a riposo più della meditazione mindfulness, in un randomizzato su 114 persone (Balban et al., Cell Rep Med 2023). È l'unica tecnica di respiro qui che ha un trial dietro: le altre presentale come cose che molti usano, non come cose che funzionano.

SONNO.
Otto-dieci ore fra i 13 e i 18. Sotto le otto il rischio di infortunio è circa 1,7 volte (Milewski et al., J Pediatr Orthop 2014). Allungare il sonno in atleti universitari ha migliorato sprint e percentuale al tiro (Mah et al., Sleep 2011). Il sonno profondo consolida quello che hai allenato e quello che hai studiato, la fase REM rielabora il carico emotivo della giornata. Non è tempo tolto: è la parte in cui la giornata si fissa. In adolescenza il ritmo circadiano si sposta avanti e va in conflitto con la sveglia: è biologia, non indisciplina.
NON usare la pulizia glinfatica come fatto acquisito: è ricerca sul topo e nel 2024 è stata contestata proprio la parte legata al sonno.

ERRORI E RUMINAZIONE.
Il cervello impara dagli scarti fra quello che si aspettava e quello che è successo, ed è uno dei risultati più solidi delle neuroscienze (segnale dopaminergico di errore di predizione, Schultz). Tradotto: un errore diventa un dato solo se lo guardi presto e con precisione, cosa hai visto, cosa hai scelto, cosa è successo. Diventa ruminazione se lo giri in testa la notte senza contenuto. La differenza non è quanto ci pensi: è se stai estraendo un'informazione o ripetendo un giudizio su di te. Quando senti la seconda, il lavoro non è capire meglio l'errore, è smettere.

ANSIA DA PRESTAZIONE.
Conta la direzione più dell'intensità: la stessa attivazione può essere letta come pronta o come minaccia, e gli esperti non ne sentono meno, la interpretano diversamente. IZOF di Hanin: non esiste un livello ottimale uguale per tutti, c'è chi gioca meglio carico e chi calmo. Teoria catastrofica di Hardy: con alta ansia cognitiva, superata una soglia, la prestazione non cala piano, crolla di colpo.
Strumenti con evidenza: imagery col modello PETTLEP, self-talk istruttivo e motivazionale, routine pre-prestazione, obiettivi di processo e di prestazione invece che di risultato, mindfulness con approccio MAC che accetta i pensieri invece di combatterli.

MOTIVAZIONE, ALLENATORE, GENITORI.
Autodeterminazione di Deci e Ryan: servono autonomia, competenza e relazione. Il clima orientato al compito protegge, quello orientato all'ego alza ansia e abbandono. Uno stile di allenatore controllante alza ansia e burnout, e vale identico per i genitori a bordo campo.
Burnout: Raedeke e Smith 2001, tre dimensioni, esaurimento fisico ed emotivo, ridotto senso di realizzazione, svalutazione dello sport. Il perfezionismo socialmente prescritto, cioè sentire che gli altri pretendono la perfezione, è il fattore di rischio più studiato.
Il supporto della squadra attenua lo stress, ed è solido come dato di comportamento. NON spiegarlo con l'ossitocina: gli effetti dell'ossitocina spray sulla fiducia non hanno retto alla replica (Nave, Camerer e McCullough 2015; Declerck et al. 2020).

SALUTE MENTALE E IDENTITÀ.
Consensus CIO 2019 (Reardon): i sintomi mentali sono frequenti negli atleti, aumentano il rischio di infortunio e ne rallentano il recupero. Le barriere note sono stigma, cultura della durezza, paura di perdere il posto.
Costruire l'identità solo sull'atleta è fragile: se arriva l'infortunio o la panchina crolla tutto insieme. L'abbandono si concentra fra i 15 e i 19 anni.

FLOW.
Come esperienza è descritto bene (Csikszentmihalyi): compito appena sopra le tue capacità, obiettivo chiaro, feedback immediato, autocritica che si spegne, tempo che cambia passo. Non si convoca, si creano le condizioni.
NON spiegarlo con l'ipofrontalità transitoria né con le onde gamma: la prima è un'ipotesi con supporto misto, e il gamma misurato con l'EEG è contaminato dai muscoli.

DOLORE, REGOLA RIGIDA E CONTROINTUITIVA.
Durante una partita il dolore può sparire davvero: esistono vie discendenti che riducono il segnale nocicettivo, dalla teoria del cancello di Melzack e Wall in poi, e l'ipoalgesia da esercizio è misurata. Questo non è un permesso, è esattamente il contrario: vuol dire che "in partita non lo sentivo" non è una prova che stai bene, ed è il motivo per cui il controllo si fa a freddo e lo fa qualcuno che ti guarda dal vivo. Non dare mai esercizi, rimedi o stretching per un dolore, nemmeno per un fastidio banale, e non far passare mai l'idea di stringere i denti.

MITI DA SMONTARE quando pertinenti.
Mentalità vincente non vuol dire non avere paura. I campioni chiedono aiuto. Le competenze psicologiche si allenano, non è "o ce l'hai o non ce l'hai". Caricare a voce alta prima di giocare peggiora ansia e abbandono. Gli stili di apprendimento visivo, uditivo e cinestetico non esistono. Sistema 1 e Sistema 2 sono un modo di parlare, non due parti del cervello, e Kahneman stesso ha riconosciuto che una parte degli studi di priming del suo libro non ha retto alla replica.

REGISTRO. Non sei uno psicologo, non fai terapia, non fai diagnosi, mai. Gli strumenti li presenti come cose che molti usano, non come una cura per lui. Niente nomi di disturbi riferiti a lui, nemmeno per esclusione.

QUANDO TI FERMI. Se emerge qualcosa oltre lo stress sportivo — tristezza che dura, ansia che occupa la giornata, non dormire, isolarsi, non trovare più senso, disagio col cibo o col corpo — non provare a gestirlo e non dare tecniche. Riconosci quello che ti ha detto senza girarci intorno, di' con calma che merita di parlarne di persona con un genitore, un adulto di cui si fida, il medico di famiglia o uno psicologo iscritto all'Albo, e resta lì senza incalzarlo. Niente elenchi di sintomi, niente domande da questionario.` },

DA SAPERE.

COSA FUNZIONA DAVVERO, e le due cose che fanno quasi tutti sono fra le peggiori.
Revisione di Dunlosky et al. 2013 su dieci tecniche: alta utilità la pratica distribuita, cioè spalmare lo studio nel tempo, e la pratica di recupero, cioè interrogarsi attivamente invece di rileggere. Moderata l'interrogazione elaborativa, l'auto-spiegazione, l'alternanza di argomenti. Bassa il rileggere, il sottolineare, l'evidenziare, il riassumere. La meta-analisi di Adesope, Trevisan e Sundararajan 2017 va nella stessa direzione: le prove di richiamo battono il rileggere in tutte le condizioni di confronto.
Perché rileggere inganna: il testo diventa familiare e la familiarità si scambia per padronanza. È l'illusione di conoscenza (Koriat e Bjork), e si rompe solo chiudendo il libro. Bjork la chiama difficoltà desiderabile: se studiare sembra facile, spesso vuol dire che non sta funzionando.
NON dire che il richiamo attivo funziona perché genera una piccola risposta di stress che ripara le sinapsi, e non dire che raddoppia la ritenzione. Il primo è inventato, il secondo è un numero che non esiste.

QUANDO RIPASSARE, ed è l'unica cosa qui che si calcola.
L'intervallo migliore fra lo studio e il ripasso dipende da quando è la prova. Cepeda, Vul, Rohrer, Wixted e Pashler, Psychol Sci 2008, 1354 partecipanti: con la prova a 7 giorni il ripasso migliore cadeva a 1 giorno, a 35 giorni cadeva a 11, a 70 giorni a 21, a un anno ancora a 21. Come lo dicono gli autori: il divario ottimale è circa il 20% del tempo che manca alla prova quando la prova è fra qualche settimana, e scende verso il 5% quando è fra un anno. Il limite va detto: il materiale erano curiosità con risposta di una parola, non capitoli di storia, quindi è un ordine di grandezza e non una data sacra.
Negli Strumenti c'è una scheda che calcola le date da questa regola: mandalo lì invece di improvvisare un calendario a occhio.
Su come distribuire più ripassi non c'è un vincitore: gli intervalli uguali vanno bene quanto quelli crescenti (Karpicke e Roediger 2007). Non vendere la ripetizione a intervalli crescenti come la via giusta.

SPIEGARE PER CAPIRE.
Spiegare un concetto a parole semplici, come lo diresti a qualcuno che non ne sa niente, fa venire fuori i buchi. Non è folklore: le persone credono di capire come funzionano le cose finché non provano a spiegarle, ed è l'illusione di profondità esplicativa (Rozenblit e Keil 2002). Però nella classifica di Dunlosky l'auto-spiegazione ha utilità moderata, non alta: è utile, non magica.

ALLENAMENTO E STUDIO, il legame va nei due sensi e uno dei due è forte e l'altro no.
Verso lo sport è forte: la fatica mentale peggiora la prestazione tecnica e alza lo sforzo percepito (Smith et al. 2016; Marcora et al. 2009). Dopo un pomeriggio pesante, una seduta storta non è un calo di livello.
Verso lo studio è debole: allenarsi attorno allo studio aiuta, ma poco. Meta-analisi su 42 esperimenti: esercizio prima di studiare d 0,23, dopo aver studiato d 0,33, durante nessun effetto. Gli autori segnalano bias di pubblicazione e forte eterogeneità fra gli studi. Sono effetti piccoli e discordanti, non una leva.
NON dire che l'esercizio raddoppia velocità e ritenzione, e non parlare di finestra neuroplastica come se fosse un orario da rispettare: quei numeri non ci sono. Il BDNF che sale nel sangue non dimostra la catena fino al voto.

CONCENTRAZIONE E INTERRUZIONI.
La memoria di lavoro tiene circa quattro cose per volta (Cowan 2001), non sette: riempirla di notifiche toglie proprio lo spazio che serve per capire. Le interruzioni costano davvero, e di più di quanto sembri mentre le fai.
NON usare il numero dei 23 minuti per tornare concentrato. Non ha una fonte pubblicata, viene da interviste, e lo studio a cui viene attribuito non misurava affatto il tempo di recupero. Un lavoro collegato riporta 11-16 minuti per riprendere il compito, che è un'altra cosa dal ritrovare la stessa profondità. Di' che il costo è reale e più alto di quanto si percepisca, senza inventare la cifra.

PAUSE E RIPOSO.
Le pause servono, e il calo di attenzione nel tempo è misurato. Dieci minuti di riposo tranquillo subito dopo aver studiato, senza schermi e senza compiti nuovi, migliorano quanto ti resta (Dewar et al. 2012).
NON dire che il cervello lavora a cicli di 90 minuti: è un'ipotesi nata sul sonno e sulla veglia non ha retto. NON dire che lo studio esaurisce il glucosio o il glicogeno del cervello e che dopo 60-90 minuti l'efficienza crolla: il consumo cerebrale è notevolmente costante e quella catena non è dimostrata. NON citare il 65% di dopamina dello yoga nidra: viene da uno studio PET su otto praticanti esperti, mai replicato.

SONNO.
Otto-dieci ore fra i 13 e i 18. In adolescenza il ritmo circadiano si sposta in avanti ed entra in conflitto con l'orario scolastico: è biologia, non pigrizia. La deprivazione cronica danneggia il consolidamento della memoria e alza il rischio di infortunio, sotto le otto ore circa 1,7 volte (Milewski et al. 2014). Il sonno non è tempo tolto allo studio: è la parte in cui lo studio si fissa.

CARRIERA DUALE.
Il progetto Studente-atleta di alto livello nasce col DM 935/2015 e col DM 279/2018 ed è oggi regolato dal DM 43 del 3 marzo 2023. Riguarda le superiori. Lo strumento è il Progetto Formativo Personalizzato, con un tutor scolastico interno e uno sportivo esterno. I requisiti sono definiti per federazione e certificati dagli enti sportivi, e le assenze per attività sportiva documentata non rientrano nel tetto del 25%. Esiste anche il liceo scientifico a indirizzo sportivo. È una sperimentazione rinnovata ogni anno: di' SEMPRE di verificare la circolare dell'anno in corso con la segreteria o il referente d'istituto.

function risolvi(m, t) {

  const b = fissi.reduce((a,v)=>({p:a.p+v.fo.p*v.g/100,c:a.c+v.fo.c*v.g/100,f:a.f+v.fo.f*v.g/100}),{p:0,c:0,f:0});

  let gp=0, gc=0, gf=0; const q=(fo,g,k)=>fo?(fo[k]*g)/100:0;
  for (let i=0;i<6;i++){
    if(fp){ gp = Math.max(fp.min, arr(Math.max(0, t.pro-b.p-q(fc,gc,"p")-q(ff,gf,"p"))/(fp.p/100), fp.step)); }
    if(fc){ gc = arr(Math.max(0, t.cho-b.c-q(fp,gp,"c")-q(ff,gf,"c"))/(fc.c/100), fc.step); }
    if(ff){ gf = arr(Math.max(0, t.fat-b.f-q(fp,gp,"f")-q(fc,gc,"f"))/(ff.f/100), ff.step); if(ff.max) gf=Math.min(gf,ff.max); }
  }
  const voci = [...fissi];
  if(fp&&gp>0) voci.push({fo:fp,g:gp}); if(fc&&gc>0) voci.push({fo:fc,g:gc}); if(ff&&gf>0) voci.push({fo:ff,g:gf});
  const tot = voci.reduce((a,v)=>({kcal:a.kcal+v.fo.kcal*v.g/100,p:a.p+v.fo.p*v.g/100,c:a.c+v.fo.c*v.g/100,f:a.f+v.fo.f*v.g/100}),{kcal:0,p:0,c:0,f:0});
  return { voci, tot };
}

   Il difetto della prima versione: prendeva peso, altezza ed età e

/* Che tipo di giornata è, secondo il calendario che ha inserito. */
function tipoGiorno(g) {
  const c = S.cal || {};
  if (c.partita === g) return "partita";
  if ((c.squadra||[]).includes(g)) return "campo";
  if ((c.palestra||[]).includes(g)) return "palestra";

}
const giornoPrima = (g) => SETT[(SETT.findIndex(x=>x[0]===g) + 6) % 7][0];
const giornoDopo  = (g) => SETT[(SETT.findIndex(x=>x[0]===g) + 1) % 7][0];

/* La settimana vera: sette giorni, ognuno col suo fabbisogno. */
function settimana() {
  if (!S.prof.cm || !S.prof.kg) return null;
  const c = S.cal || {};
  return SETT.map(([g,nome]) => {
    const t = tipoGiorno(g);
    const f = fabbisogno(S.prof, t);
    const dopoPartita = c.partita === giornoPrima(g);
    const primaPartita = c.partita === giornoDopo(g);
    return { g, nome, tipo: t, nomeTipo: GIORNI[t].n, f, dopoPartita, primaPartita };
  });
}

function parametriForza(liv, st, ob) {

function contesto(v) {
  const p = S.prof;
  const chi = [p.nome ? "Lo chiami " + p.nome : "Non sai come si chiama", "ha " + p.eta + " anni", "gioca a calcio"].join(", ");
  const minore = Number(p.eta) < 14;
  return NUCLEO + "\n\n" + v.brief + "\n\nCONTESTO: " + chi + "." +
    (minore ? " Ha meno di 14 anni e usa l'app col consenso di un genitore: linguaggio ancora più semplice e prudente." : "");
}
async function chiedi(voce, domanda) {
  const v = V[voce], storia = chat[voce] || (chat[voce] = []);
  const turni = storia.filter(m => m.r === "me" || m.r === "ai")
    .map((m, i) => ({ role: m.r === "me" ? "user" : "assistant", content: m.t }));
  /* La conoscenza viaggia dentro il primo messaggio: qui non c'è un
     parametro system separato. Si tiene corta la storia per non
     sfondare il limite di input. */
  const recenti = turni.slice(-6);
  if (recenti.length && recenti[0].role === "assistant") recenti.shift();
  const input = recenti.length
    ? [{ role: "user", content: contesto(v) + "\n\n---\n\n" + recenti[0].content }, ...recenti.slice(1)]
    : [{ role: "user", content: contesto(v) + "\n\nDOMANDA: " + domanda }];
  if (recenti.length) input.push({ role: "user", content: domanda });
  return SAMPLE(input, { modelTier: "default", onText: ({ text }) => { runtime[voce].parziale = text; if (attiva === voce) render(); } });
}
async function invia(domanda) {
  const voce = attiva, testo = String(domanda || "").trim();
  if (!testo || (runtime[voce] && runtime[voce].inCorso)) return;
  chat[voce] = chat[voce] || [];
  $("#input").value = ""; autosize();

  /* Protocollo di sicurezza: gira qui, prima di qualunque chiamata. */
  if (controlla(testo, CRISI)) {
    chat[voce].push({ r: "me", t: testo }, { r: "crisi" });
    render(); return;
  }
  const flagAlim = controlla(testo, ALIM);
  segna("chat:" + voce);
  chat[voce].push({ r: "me", t: testo });
  runtime[voce] = { inCorso: true, parziale: "", errore: null };
  render();

  if (!SAMPLE) {
    runtime[voce] = { inCorso: false, parziale: "", errore: "Il coach non è disponibile in questa vista. Gli Strumenti funzionano lo stesso." };
    render(); return;
  }
  try {
    let d = testo;
    if (flagAlim) d += "\n\n[ISTRUZIONE DI SISTEMA: in questo messaggio ci sono segnali di un rapporto difficile con il cibo o con il corpo. Non dare nessun consiglio nutrizionale, nessun numero, nessuna strategia. Riconosci quello che ha scritto con calma e senza drammatizzare, digli che vale la pena parlarne con un adulto di cui si fida o col medico, e fermati lì. Poche righe.]";
    const res = await chiedi(voce, d);
    const risposta = (res && res.text ? res.text : "").trim();
    chat[voce].push({ r: "ai", t: risposta, alim: flagAlim });
    /* Secondo controllo, sull'uscita. */
    if (controlla(risposta, USCITA)) chat[voce].push({ r: "crisi" });
    runtime[voce] = { inCorso: false, parziale: "", errore: null };
  } catch (e) {
    const c = e && e.code;
    runtime[voce] = { inCorso: false, parziale: "", errore:
      c === "rate_limited" ? "Hai fatto tante domande di fila. Aspetta un minuto e riprova."
      : c === "not_granted" ? "Serve il tuo permesso per far rispondere il coach: ricarica la pagina e accetta la richiesta."
      : "Non sono riuscito a rispondere. La tua domanda è ancora qui." };
  }
  render();
}

async function scarica(nome, dati) {

  if (!dl) { toast("Il download non è disponibile qui"); return; }
  try { await dl.save({ filename: nome, data: dati }); toast("Salvato"); }

}
function nuovoPdf(jsPDF, sotto) {
  const d = new jsPDF({ unit: "mm", format: "a4" }); const M = 14, W = 182; let y = 0;
  const testa = () => { d.setFillColor(255,106,43); d.rect(0,0,210,25,"F"); d.setFillColor(87,164,95); d.rect(0,25,210,1.6,"F");
    d.setTextColor(255,255,255); d.setFont("helvetica","bold"); d.setFontSize(19); d.text("IoAtleta",M,13.5);
    d.setFont("helvetica","normal"); d.setFontSize(8.5); d.text(sotto,M,20); y = 34; };
  testa();
  const sp = (h) => { if (y + h > 272) { d.addPage(); testa(); } };
  return {
    avviso(t){ sp(16); d.setDrawColor(255,106,43); d.setLineWidth(.5);
      const r=d.splitTextToSize(t,W-6), h=r.length*3.6+6; d.rect(M,y,W,h);
      d.setTextColor(90,60,40); d.setFont("helvetica","italic"); d.setFontSize(7.8); d.text(r,M+3,y+5); y+=h+6; },
    h1(t){ sp(13); d.setTextColor(22,28,25); d.setFont("helvetica","bold"); d.setFontSize(14); d.text(t,M,y); y+=2.5;
      d.setDrawColor(255,106,43); d.setLineWidth(.7); d.line(M,y,M+W,y); y+=7; },
    h2(t,r){ sp(9); d.setTextColor(255,106,43); d.setFont("helvetica","bold"); d.setFontSize(9.5); d.text(String(t).toUpperCase(),M,y);
      if(r){ d.setTextColor(140,148,144); d.setFont("helvetica","normal"); d.setFontSize(8); d.text(r,M+W,y,{align:"right"}); } y+=5.4; },
    riga(a,b,n){ sp(n?13:8); d.setTextColor(25,32,28); d.setFont("helvetica","bold"); d.setFontSize(9.8);
      const r=d.splitTextToSize(a,W-46); d.text(r,M,y);
      if(b){ d.setFont("helvetica","normal"); d.setTextColor(198,78,20); d.setFontSize(9); d.text(String(b),M+W,y,{align:"right"}); }
      y+=r.length*4.3;
      if(n){ d.setTextColor(112,120,116); d.setFont("helvetica","normal"); d.setFontSize(7.8);
        const q=d.splitTextToSize(n,W-6); d.text(q,M,y); y+=q.length*3.3; }
      y+=2.2; d.setDrawColor(232,232,228); d.setLineWidth(.2); d.line(M,y-1.2,M+W,y-1.2); },
    p(t){ sp(9); d.setTextColor(58,66,62); d.setFont("helvetica","normal"); d.setFontSize(9.3);
      const r=d.splitTextToSize(t,W); d.text(r,M,y); y+=r.length*4.1+2.5; },
    fonte(t){ sp(7); d.setTextColor(148,156,152); d.setFont("helvetica","italic"); d.setFontSize(6.5);
      const r=d.splitTextToSize(t,W); d.text(r,M,y); y+=r.length*2.6+3.5; },
    blob(){ return d.output("blob"); },
  };
}

/* ===================================================================
   GENERAZIONE DEL PIANO
   Il modello riceve lo scheletro già calcolato e non deve inventare
   nessun numero: deve incastrare, adattare, sostituire e spiegare.
   =================================================================== */
const REGOLE_PIANO = `Sei il preparatore di IoAtleta e stai scrivendo un piano su misura per questo ragazzo.

VINCOLI, non negoziabili.
1. Tutti i numeri che ti servono sono già calcolati qui sotto: calorie, macronutrienti giorno per giorno, serie e ripetizioni, dosi della prevenzione, fase di crescita. USA QUELLI. Non inventarne altri, non arrotondarli, non contraddirli.
2. Mai carichi in chilogrammi. Il carico si esprime in ripetizioni di riserva.
3. Non è una prescrizione: è un modello di riferimento che lui porterà a chi lo allena e, per l'alimentazione, a un medico, un dietista o un biologo nutrizionista. Scrivilo come una proposta ragionata, non come un ordine.
4. Se ha dichiarato un punto debole, il piano ne tiene conto in ogni parte, non solo nel blocco prevenzione.
5. Niente conteggio calorico ossessivo, niente cibi buoni o cattivi, niente deficit: in crescita il riferimento è il mantenimento.
6. Se nella sua richiesta c'è dolore in corso, non dare esercizi per quel dolore: dillo e mandalo dal fisioterapista, e costruisci il resto del piano attorno.

COSA DEVE ESSERE PERSONALIZZATO DAVVERO, e questo è il punto.
- La settimana va incastrata nel suo calendario vero. Il giorno dopo la partita non si fa forza pesante. Il giorno prima non si fa pliometria né sprint massimali. La prevenzione entra nei giorni in cui c'è già campo o palestra, non aggiunge sedute.
- Gli orari contano: se si allena tardi, la cena si sposta e il pasto attorno all'allenamento cambia. Se mangia in mensa, il pranzo lo subisce e va compensato altrove.
- I vincoli alimentari vanno risolti con sostituzioni concrete, non ignorati.
- La fase di crescita cambia il lavoro, non è un commento a margine.

FORMATO. Usa esattamente queste sei intestazioni, in maiuscolo, ognuna su una riga da sola, senza numerarle e senza altri titoli:
LA TUA SETTIMANA
LA SEDUTA DI FORZA
PREVENZIONE
A TAVOLA
SE LA SETTIMANA SI COMPLICA
DA PORTARE A CHI TI SEGUE

Dentro ogni sezione righe brevi, niente grassetti, niente elenchi numerati, niente emoji. Sotto le 700 parole in tutto. Italiano parlato, diretto, come parla un preparatore che ha poco tempo e sa quello che dice.
In "SE LA SETTIMANA SI COMPLICA" metti l'ordine con cui si toglie roba quando scuola o stanchezza si mangiano il tempo: cosa cade per primo e cosa non cade mai.
In "DA PORTARE A CHI TI SEGUE" scrivi tre o quattro righe che lui può leggere ad alta voce al suo allenatore o al professionista.`;

async function generaPiano() {
  if (!SAMPLE) { toast("Il coach non è disponibile in questa vista"); return; }
  const scheletro = scheletroPiano();
  if (!scheletro) { toast("Prima metti statura e peso"); return; }
  S.pianoStato = "in corso"; S.piano = ""; render();
  try {
    const res = await SAMPLE([{ role:"user", content: REGOLE_PIANO + "\n\n=== DATI CALCOLATI ===\n" + scheletro + "\n\nScrivi il piano." }],
      { modelTier:"complex", onText: ({ text }) => { S.piano = text; const e = document.querySelector("#pianoOut"); if (e) e.textContent = text; } });
    S.piano = (res && res.text ? res.text : "").trim();
    S.pianoAl = new Date().toLocaleDateString("it-IT", { day:"numeric", month:"long" });
    S.pianoStato = null; salva(); render();
  } catch (e) {
    S.pianoStato = null;
    S.piano = null;
    toast(e && e.code === "rate_limited" ? "Troppe richieste di fila, aspetta un minuto" : "Non sono riuscito a generare il piano");
    render();
  }
}

function pannelloDev() {

  const gg = S.usoDal ? Math.max(1, traGiorni(S.usoDal, isoData(new Date())) + 1) : 1;
  const d = document.createElement("div");
  d.className = "dev"; d.id = "dev";
  d.innerHTML = `<button class="via" id="devVia">Chiudi</button>
    <h3>Uso</h3>
    <p class="sub" style="margin:0 0 14px">${tot} azioni in ${gg} ${gg===1?"giorno":"giorni"}, ${Math.round(tot/gg)} al giorno.
      Tutto da questo dispositivo: l'artifact non ha un server, quindi qui non arrivano i numeri di nessun altro.</p>
    ${righe.length ? righe.map(([k,n]) => { const p = k.split(":"), id = p[1] || k;
      return `<div class="rg"><div>${esc(ETICHETTE[id] || (V[id] ? V[id].t : id))}<br><span>${NOMI_USO[p[0]]||p[0]}</span></div><b>${n}</b></div>`; }).join("")
      : `<p class="vuoto">Ancora niente. Gira un po' nell'app e torna qui.</p>`}
    <div class="row2" style="margin-top:18px">
      <button class="btn ghost" id="devCopia">Copia i numeri</button>
      <button class="btn ghost" id="devZero">Azzera</button></div>
    <p class="avv" style="margin-top:16px">Per vedere cosa fanno gli altri servirebbe un server tuo, e prima ancora una nota sulla privacy e il consenso: chi usa IoAtleta è minorenne, e l'app promette in prima pagina che i dati restano sul dispositivo. Quella promessa vale più di qualsiasi statistica. Quando farai il deploy vero, la misurazione si progetta insieme all'informativa, non dopo.</p>`;
  document.body.appendChild(d);
  $("#devVia").onclick = () => d.remove();
  $("#devZero").onclick = () => { if (!confirm("Azzero i conteggi?")) return; S.uso = {}; S.usoDal = null; salva(); d.remove(); toast("Conteggi azzerati"); };
  $("#devCopia").onclick = async () => {

    try { await navigator.clipboard.writeText(t); toast("Copiati"); } catch (e) { toast("Non riesco a copiare"); }

}

/* ===================================================================
   OGGI — la pagina che dà un motivo per riaprire l'app.
   Non decora: mostra che giornata è secondo il calendario vero, cosa
   cambia oggi, quanto sta caricando e quanto sta crescendo. Ogni
   numero qui è calcolato dai suoi dati, nessuno è inventato.
   =================================================================== */
const COLORE = { partita:"#d95926", campo:"#199e70", palestra:"#3987e5", riposo:null };
const ETICH  = { partita:"GARA", campo:"CAMPO", palestra:"PESI", riposo:"OFF" };
const CHIAVI = ["lun","mar","mer","gio","ven","sab","dom"];
const GRIGIO = "#7C8B80";

const it = (x) => String(x).replace(".", ",");   /* i decimali qui si scrivono con la virgola */
const isoData = (d) => { const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const chiaveOggi = () => CHIAVI[(new Date().getDay() + 6) % 7];
function lunedi() { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d; }
function sedutePrev() { const l = isoData(lunedi()); return new Set((S.prev||[]).filter(x => x >= l)).size; }

/* barra orizzontale: la larghezza parte da zero e si anima dopo il render */
function barra(nome, val, unita, max, col) {
  const w = max > 0 ? Math.max(2, Math.min(100, Math.round(val / max * 100))) : 0;
  return `<div class="barra"><div class="et"><b>${esc(nome)}</b><span>${val}${unita ? " " + unita : ""}</span></div>
    <div class="tr"><div class="fi" data-w="${w}" style="background:${col}"></div></div></div>`;
}

/* carico delle ultime sedute: una barra per seduta, una sola tinta,
   perché è magnitudine e non identità. */
function svgCarichi(vals) {
  const W = 320, H = 90, n = vals.length, max = Math.max.apply(null, vals.map(v => v.ua).concat([1]));
  /* marchi sottili: la barra non supera i 22, il resto diventa spazio */
  const bw = Math.max(5, Math.min(22, W / n * 0.72)), gap = n > 1 ? (W - bw * n) / (n - 1) : 0;
  let s = `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Carico delle ultime sedute registrate">`;
  vals.forEach((v, i) => {
    const h = Math.max(3, Math.round(v.ua / max * (H - 20)));
    const x = i * (bw + gap);
    s += `<rect x="${x.toFixed(1)}" y="${H - 14 - h}" width="${bw.toFixed(1)}" height="${h}" rx="3" fill="#3987e5"></rect>`;
  });
  s += `<text x="0" y="${H - 2}">${vals.length} sedute</text><text x="${W}" y="${H - 2}" text-anchor="end">picco ${max} UA</text></svg>`;
  return s;
}

/* statura nel tempo: linea, solo da tre misure in su. Sotto quella
   soglia una linea suggerirebbe una tendenza che non c'è. */
function svgStatura(ms) {
  const pts = ms.slice(-8), W = 320, H = 96, P = 16;
  const ys = pts.map(m => m.statura), lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys), sp = (hi - lo) || 1;
  const X = (i) => P + i * ((W - P * 2) / Math.max(1, pts.length - 1));
  const Y = (v) => H - 20 - ((v - lo) / sp) * (H - 42);
  const d = pts.map((m, i) => (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(m.statura).toFixed(1)).join(" ");
  let s = `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Statura misurata nel tempo">`;
  s += `<path d="${d}" fill="none" stroke="#199e70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>`;
  pts.forEach((m, i) => { s += `<circle cx="${X(i).toFixed(1)}" cy="${Y(m.statura).toFixed(1)}" r="4" fill="#199e70" stroke="#111E17" stroke-width="2"></circle>`; });
  s += `<text x="0" y="9">${hi} cm</text><text x="0" y="${H - 4}">${lo} cm</text>`;
  s += `<text x="${W}" y="${H - 4}" text-anchor="end">${pts.length} misure</text></svg>`;
  return s;
}

/* la velocità di crescita contro la soglia dichiarata, non contro sé stessa */
function barraCrescita(cm) {
  const scala = 12, w = Math.min(100, cm / scala * 100), t = 7.2 / scala * 100;
  const col = cm >= 7.2 ? "#d95926" : "#199e70";
  return `<div class="barra" style="margin-top:8px">
    <div class="tr" style="position:relative;height:10px">
      <div class="fi" data-w="${w.toFixed(1)}" style="background:${col}"></div>
      <div style="position:absolute;left:${t.toFixed(1)}%;top:0;bottom:0;width:2px;background:var(--cream);opacity:.7"></div>
    </div>
    <div class="et" style="margin-top:5px"><b style="color:var(--muted);font-size:11px">scala 0-12 cm/anno</b><span style="color:var(--muted);font-size:11px;font-family:var(--body);font-weight:400">la tacca è 7,2</span></div>
  </div>`;
}

/* Scheda pieghevole. La riga di sintesi non è decorazione: una scheda
   chiusa deve rispondere lo stesso alla sua domanda, altrimenti chiudere
   non ordina, nasconde — e lui finisce ad aprirle tutte ogni volta. */
function scheda(id, titolo, sintesi, corpo, apertoDiDefault) {
  const a = (S.aperti && S.aperti[id] != null) ? S.aperti[id] : !!apertoDiDefault;
  return `<details class="card pieg" data-ap="${id}"${a ? " open" : ""}>
    <summary><span class="ti"><b>${esc(titolo)}</b>${sintesi ? `<i>${sintesi}</i>` : ""}</span><u>+</u></summary>
    <div class="dentro">${corpo}</div></details>`;
}
/* Chromium spara un evento toggle anche quando una scheda nasce già
   aperta dal render: senza questo confronto i conteggi si gonfiavano
   a ogni ridisegno e il pannello mentiva. */
const statoAp = {};
function legaSchede() {
  cont().querySelectorAll("[data-ap]").forEach(d => {
    const id = d.dataset.ap;
    statoAp[id] = d.open;
    d.addEventListener("toggle", () => {
      if (statoAp[id] === d.open) return;
      statoAp[id] = d.open;
      S.aperti = S.aperti || {}; S.aperti[id] = d.open;
      if (d.open) segna("apre:" + id);
      clearTimeout(legaSchede.t); legaSchede.t = setTimeout(salva, 800);
    });
  });
}

/* il piano generato, spezzato nelle sue sezioni */
const TITOLI_PIANO = ["LA TUA SETTIMANA","LA SEDUTA DI FORZA","PREVENZIONE","A TAVOLA","SE LA SETTIMANA SI COMPLICA","DA PORTARE A CHI TI SEGUE"];
function sezioniPiano(t) {
  if (!t) return [];
  const out = []; let cur = null;
  String(t).split("\n").forEach(r => {
    const s = r.trim();
    if (TITOLI_PIANO.indexOf(s) >= 0) { cur = { t: s, c: [] }; out.push(cur); return; }
    if (cur) cur.c.push(r); else if (s) { cur = { t: "Il piano", c: [r] }; out.push(cur); }
  });
  return out.map(s => ({ t: s.t, c: s.c.join("\n").trim() })).filter(s => s.c);
}
const accordion = (sez, aperti) => sez.map((s, i) =>
  `<details class="acc"${i < (aperti || 0) ? " open" : ""}><summary><b>${esc(s.t)}</b><i>+</i></summary>
    <div class="co">${esc(s.c)}</div></details>`).join("");

function strisciaSettimana(sett, sel, kOggi) {
  const lun = lunedi();
  let studio = false;
  const celle = sett.map((d, i) => {
    const col = COLORE[d.tipo];
    const fondo = col ? `background:${col};color:#0B1410` : `border:1px dashed var(--line2);color:var(--muted)`;
    const dt = new Date(lun); dt.setDate(lun.getDate() + i);
    const rip = ripassiIn(isoData(dt));
    if (rip.length) studio = true;
    return `<button class="gcell${d.g === sel ? " sel" : ""}${d.g === kOggi ? " oggi" : ""}" data-gg="${d.g}"
      aria-pressed="${d.g === sel}" aria-label="${d.nome}, ${d.nomeTipo}${rip.length ? ", ripasso di " + rip.map(x=>x.m).join(" e ") : ""}">
      ${rip.length ? '<em class="rip" title="ripasso"></em>' : ''}
      <b>${d.nome.slice(0,3).toUpperCase()}</b><u style="${fondo}">${ETICH[d.tipo]}</u></button>`;
  }).join("");
  return `<div class="settimana">${celle}</div>
  <div class="legenda">
    <span><i style="background:#199e70"></i>campo</span>
    <span><i style="background:#3987e5"></i>pesi</span>
    <span><i style="background:#d95926"></i>gara</span>
    <span><i style="border:1px dashed var(--line2);background:none"></i>riposo</span>
    ${studio ? '<span><i style="background:var(--sand);border-radius:50%;width:7px;height:7px;flex-basis:7px"></i>ripasso</span>' : ''}
  </div>`;
}

function renderOggi() {
  const p = S.prof;

  if (!p.cm || !p.kg) {
    cont().innerHTML = `<div class="schede"><div class="card"><h2>Qui manca il minimo</h2>
      <p class="sub">Questa pagina si costruisce sulle tue misure e sul tuo calendario vero. Senza statura e peso non calcolo niente, e preferisco non mostrarti numeri finti.</p>
      <button class="btn" data-va="strumenti">Metti statura e peso</button></div>
      <div class="card"><h2>Cosa comparirà</h2>
        <div class="riga"><div class="n">Che giornata è oggi<small>Campo, pesi, gara o riposo, presi dal calendario che imposti negli Strumenti.</small></div></div>
        <div class="riga"><div class="n">Quanto ti serve mangiare oggi<small>I carboidrati cambiano con il tipo di giornata: non è lo stesso numero tutti i giorni.</small></div></div>
        <div class="riga"><div class="n">La prevenzione della settimana<small>Ogni seduta settimanale in più vale circa un 23% di infortuni in meno. Vale la pena contarle.</small></div></div>
        <div class="riga"><div class="n">Quanto stai crescendo e quanto stai caricando<small>Due grafici che si riempiono man mano che registri.</small></div></div></div></div>`;
    legaOggi(); return;
  }

  const sett = settimana(), kOggi = chiaveOggi(), sel = selGiorno || kOggi;
  const g = sett.find(x => x.g === sel) || sett[0];
  const col = COLORE[g.tipo] || GRIGIO;
  const c = S.cal || {};
  const lun = lunedi(), dSel = new Date(lun); dSel.setDate(lun.getDate() + CHIAVI.indexOf(g.g));
  const isoSel = isoData(dSel), isoOggi = isoData(new Date());
  const st = stimaMaturazione({ sesso:p.sesso, eta:p.eta, statura:p.cm, staturaSeduta:p.cmSeduto, massa:p.kg });
  const ad = adattamentiCrescita(st), par = parametriForza(S.liv, st, S.obiettivo);
  const vc = velocitaCrescita(S.misure);

  let h = `<div class="oggiTop">
    <div><div class="dt">${g.nome}</div>
      <div class="ds">${g.g === kOggi ? "oggi · " : ""}${dSel.toLocaleDateString("it-IT",{day:"numeric",month:"long"})}</div></div>
    <div style="margin-left:auto"><span class="tipoDi" style="${col === GRIGIO
      ? "border:1px dashed var(--line2);color:var(--muted)" : "background:" + col + ";color:#0B1410"}">${g.nomeTipo}</span></div>
  </div>`;

  h += strisciaSettimana(sett, sel, kOggi) + '<div class="schede">';

  /* cosa cambia in questo giorno, e perché */
  const note = [];
  if (g.tipo === "partita") note.push(["Si gioca" + (c.oraPartita ? " alle " + c.oraPartita : ""), "Il pasto principale si chiude tre o quattro ore prima, poi solo cose leggere e già note."]);
  if (g.tipo === "campo") note.push(["Campo con la squadra" + (c.oraAllenamento ? " alle " + c.oraAllenamento : ""), "È qui che entra la prevenzione: si aggancia a una seduta che c'è già, non ne aggiunge una."]);
  if (g.tipo === "palestra") note.push(["Sala pesi", g.dopoPartita
    ? "Ma cade il giorno dopo la partita, e lì la seduta pesante non ci sta: o si sposta di un giorno, o resta lavoro leggero e prevenzione. Questa è una cosa da dire a chi ti allena, non da decidere da solo."
    : par.s + " serie × " + par.r + ", recupero " + par.rec + ", lasciando " + par.rir + ". " + (par.nota || "")]);
  if (g.tipo === "riposo") note.push(["Nessuna seduta prevista", "Il riposo non è tempo perso: è la parte in cui l'allenamento diventa adattamento."]);
  if (g.dopoPartita && g.tipo !== "palestra") note.push(["È il giorno dopo la partita", "Niente forza pesante e niente sprint massimali: il muscolo sta ancora riparando."]);
  if (g.primaPartita) note.push(["È il giorno prima della partita", "Niente pliometria e niente sprint massimali. Si tiene su la sensibilità, non si costruisce."]);
  if (["lun","mar","mer","gio","ven"].indexOf(g.g) >= 0 && (g.tipo === "campo" || g.tipo === "partita"))
    note.push(["Scuola e campo nella stessa giornata",
      "Trenta minuti di lavoro cognitivo prima di giocare bastano a peggiorare precisione dei passaggi e decisioni, e a far sembrare più duro lo stesso sforzo. Non è una scusa: è il motivo per cui una seduta storta di giovedì non è un calo di livello. Se puoi, la mezz'ora prima non la passi sui libri."]);
  if (ad.regole[0]) note.push(["Fase di crescita: " + ad.fase, ad.regole[0]]);

  h += scheda("cambia", "Cosa cambia " + (g.g === kOggi ? "oggi" : "questo giorno"),
    note.length ? esc(note[0][0]) + (note.length > 1 ? " · e altre " + (note.length-1) : "") : "Niente di particolare",
    note.map(n => `<div class="riga"><div class="n">${esc(n[0])}<small>${esc(n[1])}</small></div></div>`).join(""), true);

  /* fabbisogno del giorno, confrontato con il giorno più pesante della settimana */
  if (g.f) {
    const mx = (k) => Math.max.apply(null, sett.map(d => d.f ? d.f[k] : 0).concat([1]));
    h += scheda("fabbisogno", "Quanto ti serve " + (g.g === kOggi ? "oggi" : "quel giorno"),
      g.f.kcal + " kcal · " + g.f.cho + " g di carboidrati · " + g.f.pro + " g di proteine", `
      <p class="sub">Le barre confrontano questo giorno col più pesante della tua settimana. Mantenimento, non surplus e non deficit: in crescita è il riferimento giusto.</p>
      ${barra("Energia", g.f.kcal, "kcal", mx("kcal"), col)}
      ${barra("Carboidrati", g.f.cho, "g", mx("cho"), col)}
      ${barra("Grassi", g.f.fat, "g", mx("fat"), col)}
      <div class="riga" style="margin-top:12px"><div class="n">Proteine<small>Uguali tutti i giorni, ed è il punto: 1,5 g/kg si tengono anche a riposo, perché servono a riparare quello che hai fatto ieri. A cambiare con la giornata sono i carboidrati, che sono il carburante.</small></div><div class="v">${g.f.pro} g</div></div>
      <p class="fonte">Carboidrati per tipo di giornata e proteine 1,5 g/kg: Thomas, Erdman e Burke, J Acad Nutr Diet 2016; Jäger et al., J Int Soc Sports Nutr 2017; LARN-SINU 2014. Sono valori di riferimento, non una prescrizione.</p>
      <button class="btn ghost" data-va="strumenti" style="margin-top:4px">Vedi il modello alimentare completo</button>`);
  }

  /* ripassi del giorno: lo studio entra nel calendario come il campo */
  const rip = ripassiIn(isoSel);
  if (rip.length) {
    h += scheda("ripassiOggi", "Da ripassare", rip.map(x => esc(x.m)).join(", "), `
      <p class="sub">A libro chiuso. Rileggere non conta come ripasso: quello che consolida è provare a tirare fuori la roba senza guardare, anche male.</p>
      ${rip.map(x => { const q = traGiorni(isoSel, x.e);
        return `<div class="riga"><div class="n">${esc(x.m)}<small>${q > 0 ? "La prova è fra " + q + (q === 1 ? " giorno" : " giorni") + "." : q === 0 ? "La prova è oggi." : "La prova è passata."}</small></div>
          <div class="v">${q > 0 ? "-" + q : q === 0 ? "oggi" : "—"}</div></div>`; }).join("")}
      ${(g.tipo === "partita" || g.tipo === "campo")
        ? `<p class="avv">Oggi c'è anche ${g.tipo === "partita" ? "la partita" : "il campo"}. Se puoi, il ripasso lo fai dopo e non nella mezz'ora prima di uscire: la fatica mentale prima di giocare peggiora passaggi e decisioni (Smith et al. 2016).</p>` : ""}
      <p class="fonte">Date calcolate da Cepeda et al., Psychol Sci 2008. Pratica di recupero: Dunlosky et al. 2013, alta utilità.</p>`, true);
  }

  /* prevenzione: l'unica cosa che si conta, e si conta perché il conteggio è il dato */
  const prev = prevenzioneMirata(S.punti, st), n = sedutePrev();
  const fatta = (S.prev || []).indexOf(isoSel) >= 0;
  h += scheda("prevenzione", "Prevenzione",
    n + (n === 1 ? " seduta" : " sedute") + " questa settimana" + (prev.length ? " · " + prev.length + " esercizi" : ""), `
    <div class="conta"><b>${n}</b><span>${n === 1 ? "seduta" : "sedute"} questa settimana.<br>Ogni seduta settimanale in più vale circa un 23% di infortuni in meno.</span></div>
    ${prev.map(x => `<div class="riga"><div class="n">${esc(x.n)}<small><b style="color:var(--orange);font-weight:700">${esc(x.d)}</b>${x.note ? " — " + esc(x.note) : ""}</small></div></div>`).join("")}
    ${isoSel <= isoOggi
      ? `<button class="chk${fatta ? " fatto" : ""}" data-pv="${isoSel}" style="margin-top:6px"><i></i><span>${fatta ? "Fatta" : "Segna che l'hai fatta"} — ${g.nome.toLowerCase()} ${dSel.getDate()}</span></button>`
      : `<p class="vuoto">Questo giorno non è ancora arrivato.</p>`}
    <p class="fonte">Rössler et al., Sports Med 2018 (11+ Kids: meno 48% di infortuni, meno 74% dei gravi, meno 23% per ogni sessione settimanale in più) · Harøy et al., Br J Sports Med 2019 · van Dyk et al., Br J Sports Med 2019, con la rianalisi di Impellizzeri et al. 2021 che la giudica inconcludente. Il conteggio è tuo e resta su questo dispositivo.</p>`, false);

  /* crescita */
  let hC = "";
  if (vc.no) {
    hC = `<p class="vuoto">${esc(vc.no)} Ne hai ${S.misure.length}. Serve solo un metro, sempre alla stessa ora e senza scarpe.</p>
      <button class="btn ghost" data-va="strumenti">Aggiungi una misura</button>`;
  } else {
    hC = `<div class="conta"><b style="color:${vc.sopra ? "#d95926" : "#199e70"}">${it(vc.cmAnno)}</b><span>cm all'anno, su ${vc.mesi} mesi.<br>${vc.sopra
      ? "Sopra la soglia: l'osso corre più di muscoli e tendini. Non è un calo di talento, è biologia temporanea, e chi ti allena dovrebbe saperlo."
      : "Ritmo nella norma per il periodo osservato."}</span></div>
      ${barraCrescita(vc.cmAnno)}
      ${S.misure.length >= 3 ? svgStatura(S.misure) : ""}`;
  }
  if (st) hC += `<div class="riga" style="margin-top:8px"><div class="n">Distanza dal picco di crescita<small>Fascia ${it(st.intervallo[0])} / ${it(st.intervallo[1])}. L'errore standard è di circa mezzo anno, e solo il 42% delle stime cade dentro quel margine.</small></div><div class="v">${st.offset > 0 ? "+" : ""}${it(st.offset)} anni</div></div>`;
  hC += `<p class="fonte">Soglia 7,2 cm/anno: Hall ed Erskine, Sports Med 2026. Stima del picco: Mirwald et al. 2002 · Moore et al. 2015 · Koziel e Malina, Sports Med 2018.</p>`;
  h += scheda("crescita", "Quanto stai crescendo",
    vc.no ? "Servono almeno due misure" : it(vc.cmAnno) + " cm all'anno" + (vc.sopra ? " · sopra la soglia" : " · nella norma"),
    hC, !!vc.sopra);

  /* carico */
  const lett = letturaSettimana(S.carichi.map(x => x.ua));
  const t = letturaTesta(S.carichi);
  let hL = "";
  if (!S.carichi.length) {
    hL = `<p class="vuoto">Nessuna seduta registrata. Sforzo percepito da 0 a 10 moltiplicato per i minuti: due numeri a fine allenamento.</p>
      <button class="btn ghost" data-va="strumenti">Registra una seduta</button>`;
  } else {
    hL = svgCarichi(S.carichi.slice(-14));
    if (lett) hL += `<div class="stat" style="margin-top:10px"><div><div class="big">${lett.totale}</div><div class="unit">carico totale</div></div>
      <div><div class="big">${lett.monotonia != null ? it(lett.monotonia) : "—"}</div><div class="unit">monotonia</div></div>
      <div><div class="big">${lett.scarichi}</div><div class="unit">giorni scarichi</div></div></div>`;
    else hL += `<p class="vuoto" style="margin-top:8px">Da tre sedute in poi compare anche la lettura della settimana.</p>`;
    if (t) hL += `<div class="riga" style="margin-top:6px"><div class="n">Testa e gambe cariche insieme<small>${t.insieme === 0
      ? "Non è ancora capitato. Media di quanto arrivavi spremuto: " + it(t.media) + " su 10."
      : "Sedute in cui eri già spremuto dalla giornata e il carico era comunque alto. Sono quelle in cui è normale essere andati peggio: la fatica mentale non aggiunge lavoro, peggiora quello che fai."}</small></div><div class="v">${t.insieme}</div></div>`;
  }
  hL += `<p class="fonte">Sforzo percepito per minuti: Foster et al., J Strength Cond Res 2001. Fatica mentale: Smith et al., Med Sci Sports Exerc 2016 · Marcora et al., J Appl Physiol 2009. Niente ACWR: in uno studio randomizzato su 482 giovani calciatori non ha ridotto nulla (Dalen-Lorentsen et al. 2021). Si guardano le tendenze, non i rapporti.</p>`;
  h += scheda("carico", "Quanto stai caricando",
    !S.carichi.length ? "Nessuna seduta registrata"
      : (lett ? "totale " + lett.totale + " · monotonia " + (lett.monotonia != null ? it(lett.monotonia) : "—") : S.carichi.length + " sedute")
        + (t && t.insieme ? " · " + t.insieme + " con la testa già carica" : ""),
    hL, false);

  /* il piano, se c'è */
  const sez = sezioniPiano(S.piano);
  if (sez.length) {
    h += scheda("pianoOggi", "Il tuo piano", S.pianoAl ? "aggiornato il " + esc(S.pianoAl) : "pronto",
      accordion(sez.slice(0, 2), 1) +
      `<button class="btn ghost" data-va="strumenti" style="margin-top:10px">Apri il piano intero</button>`, false);
  } else {
    h += scheda("pianoVuoto", "Non hai ancora un piano", "Il calendario è la parte che cambia tutto",
      `<p class="sub">Con il calendario, il ruolo, i punti deboli e come mangi, l'app costruisce i numeri e li fa incastrare in una settimana che è la tua. È un modello da portare a chi ti segue, non una prescrizione.</p>
      <button class="btn" data-va="strumenti">Costruiscilo</button>`, true);
  }

  cont().innerHTML = h + "</div>";
  legaOggi(); legaSchede(); impagina();
}

function legaOggi() {
  const qa = (s) => cont().querySelectorAll(s);
  qa("[data-gg]").forEach(b => b.onclick = () => { segna("gg:" + b.dataset.gg); selGiorno = b.dataset.gg; renderOggi(); });
  qa("[data-va]").forEach(b => b.onclick = () => { segna("btn:vai-" + b.dataset.va); attiva = b.dataset.va; render(); $("#body").scrollTop = 0; });
  qa("[data-pv]").forEach(b => b.onclick = () => {
    segna("btn:prevenzione-fatta");
    const d = b.dataset.pv, a = S.prev || (S.prev = []), i = a.indexOf(d);
    if (i >= 0) a.splice(i, 1); else a.push(d);
    salva(); renderOggi(); toast(i >= 0 ? "Tolta" : "Segnata");
  });
  animaBarre();
}
/* ===================================================================
   IMPAGINAZIONE
   Su schermo largo le schede vanno in due o tre colonne vere: ognuna
   scorre per conto suo, così aprirne una non sposta le altre. Il
   numero di colonne lo decide lo spazio, non un interruttore.
   =================================================================== */
function impagina() {
  const box = cont().querySelector(".schede");
  if (!box) return;
  const w = window.innerWidth;
  const n = w >= 1560 && $(".app").dataset.vista === "pannello" ? 3 : w >= 700 ? 2 : 1;
  const voci = box.__voci || (box.__voci = Array.from(box.children));
  if (box.__n === n) return;
  box.__n = n;
  box.textContent = "";
  if (n === 1) { voci.forEach(v => box.appendChild(v)); return; }
  const cols = [];
  for (let i = 0; i < n; i++) { const c = document.createElement("div"); c.className = "col"; box.appendChild(c); cols.push(c); }
  voci.forEach(v => {
    let corta = cols[0];
    cols.forEach(c => { if (c.offsetHeight < corta.offsetHeight) corta = c; });
    corta.appendChild(v);
  });
}
let ridT;
window.addEventListener("resize", () => { clearTimeout(ridT); ridT = setTimeout(impagina, 150); });

const animaBarre = () => requestAnimationFrame(() =>
  cont().querySelectorAll(".fi[data-w]").forEach(e => { e.style.width = e.dataset.w + "%"; }));

    <div id="triQ">${[...URGENTI,...PRESTO].map(([k,d])=>`<button class="chk${TRI[k]?" on":""}" data-t="${k}"><i></i><span>${esc(d)}</span></button>`).join("")}</div>
    <div id="triOut"></div>`, false);

  if (completo) {

        <div><div class="big o">${t.cho}</div><div class="unit">carboidrati</div></div>
        <div><div class="big o">${t.fat}</div><div class="unit">grassi</div></div></div>
      ${piano.pasti.map(m=>`<div class="blocco"><div class="t"><i>·</i><b>${m.nome}</b><span style="margin-left:auto;color:var(--muted);font-size:11px">${Math.round(m.tot.kcal)} kcal</span></div>
        ${m.voci.map(v=>`<div class="riga"><div class="n">${esc(v.fo.nome)}</div><div class="v">${v.g} ${v.fo.um==="ml"?"ml":"g"}</div></div>`).join("")}</div>`).join("")}
      <div class="blocco"><div class="t"><i>·</i><b>Attorno all'allenamento</b></div>
        ${timing(p.kg).map(r=>`<div class="riga"><div class="n">${r[0]}<small>${r[2]}</small></div><div class="v">${r[1]}</div></div>`).join("")}</div>
      <p class="fonte">Thomas, Erdman e Burke, J Acad Nutr Diet 2016 · Jäger et al., J Int Soc Sports Nutr 2017 · LARN-SINU 2014 · composizione alimenti CREA. Grammature arrotondate.</p>
      <div class="row2"><button class="btn ghost" id="nVar">Cambia gli alimenti</button><button class="btn ghost" id="nPdf">Scarica PDF</button></div>`, false);
  }

  /* allenamento */
  h += scheda("lavoro", "Modello di lavoro",
    S.sedute + (S.sedute===1?" seduta":" sedute") + " a settimana · " + ({p:"principiante",i:"intermedio",a:"avanzato"}[S.liv]), `
    <p class="sub">Nessun carico in chilogrammi, di proposito: si regola lasciando ripetizioni di riserva. Chi ti allena può cambiare tutto, ed è il motivo per cui esiste.</p>
    <div class="pills">${[["p","Principiante"],["i","Intermedio"],["a","Avanzato"]].map(([k,n])=>`<button class="pill${S.liv===k?" on":""}" data-l="${k}">${n}</button>`).join("")}
      ${[1,2,3].map(n=>`<button class="pill${S.sedute===n?" on":""}" data-s="${n}">${n} ${n===1?"seduta":"sedute"}</button>`).join("")}</div>
    ${modelloScheda(S.liv,S.sedute).map(s=>`<div class="blocco"><div class="t"><b>${s.nome}</b><span style="margin-left:auto;color:var(--muted);font-size:11px">${s.focus}</span></div>
      ${s.blocchi.map((b,i)=>`<div class="blocco"><div class="t"><i>0${i+1}</i><b>${b.t}</b></div>
        ${b.voci.map(v=>`<div class="riga"><div class="n">${esc(v[0])}${v[2]?`<small>${esc(v[2])}</small>`:""}</div><div class="v">${esc(v[1])}</div></div>`).join("")}</div>`).join("")}</div>`).join("")}
    <p class="fonte">FIFA 11+ (F-MARC 2007) · Faigenbaum et al., NSCA 2009 · Harøy et al., Br J Sports Med 2019 · van Dyk et al., Br J Sports Med 2019.</p>
    <button class="btn ghost" id="sPdf" style="margin-top:10px">Scarica PDF</button>`, false);

  /* carico */
  const lett = letturaSettimana(S.carichi.map(c=>c.ua));
  h += scheda("caricoStr", "Quanto stai caricando",
    S.carichi.length ? S.carichi.length + " sedute registrate" + (lett ? " · monotonia " + (lett.monotonia!=null?it(lett.monotonia):"—") : "") : "Nessuna seduta registrata", `
    <p class="sub">Sforzo percepito da 0 a 10 moltiplicato per i minuti. Niente ACWR: in uno studio randomizzato su 482 giovani calciatori non ha ridotto nulla.</p>
    <div class="g3"><label class="f"><b>Sforzo</b><input id="cR" type="number" inputmode="numeric" placeholder="7"></label>
      <label class="f"><b>Minuti</b><input id="cM" type="number" inputmode="numeric" placeholder="90"></label>
      <label class="f"><b>Testa</b><input id="cT" type="number" inputmode="numeric" placeholder="6"></label></div>
    <p class="sub" style="margin:-6px 0 12px">"Testa" è quanto ti aveva già spremuto la giornata prima di allenarti: scuola, verifiche, studio, da 0 a 10. È facoltativo, ma è il numero che quasi nessuno registra e che spiega parecchie sedute storte.</p>
    <button class="btn b2" id="cAdd">Registra la seduta</button>
    ${S.carichi.length?`<button class="btn ghost" id="cReset" style="margin-top:8px">Azzera</button>`:""}
    ${lett?`<div class="esito"><div class="stat"><div><div class="big">${lett.totale}</div><div class="unit">carico totale</div></div>
      <div><div class="big">${lett.monotonia!=null?it(lett.monotonia):"—"}</div><div class="unit">monotonia</div></div>
      <div><div class="big">${lett.scarichi}</div><div class="unit">giorni scarichi</div></div></div>
      <p class="avv">Si guardano le tendenze, non i rapporti. Foster et al. 2001 · Impellizzeri et al., Sports Med 2021 · Dalen-Lorentsen et al., Br J Sports Med 2021.</p></div>
      ${(() => { const t = letturaTesta(S.carichi); return !t ? "" : `<div class="blocco"><div class="t"><i>·</i><b>La testa</b></div>
        <div class="riga"><div class="n">Quanto arrivavi spremuto, in media<small>Su ${t.n} sedute in cui l'hai segnato.</small></div><div class="v">${it(t.media)} / 10</div></div>
        <div class="riga"><div class="n">Volte che testa pesante e seduta pesante sono capitate insieme<small>${t.insieme === 0
          ? "Nessuna, per ora. Se ricominciano a sovrapporsi vale la pena spostare qualcosa."
          : "Sono le sedute in cui è normale che tu sia andato peggio, e non vuol dire che stai calando. La fatica mentale non aggiunge lavoro: peggiora quello che fai. Se si ripete sempre lo stesso giorno, quel giorno è da sistemare, non da subire."}</small></div><div class="v">${t.insieme}</div></div>
        <p class="avv">Smith et al., Med Sci Sports Exerc 2016 (passaggi e decisioni peggiori dopo 30 minuti di compito cognitivo) · Marcora et al., J Appl Physiol 2009 (sforzo percepito più alto e 15% di tempo a esaurimento in meno, a parità di cuore e lattato). Soglia "pesante" fissata a 7 da questa app, non da uno studio.</p></div>`; })()}`
      :`<p class="avv">Registra almeno tre sedute per avere una lettura. Ne hai ${S.carichi.length}.</p>`}
    ${S.prof.eta?`<div class="blocco"><div class="t"><i>·</i><b>Ore contro età</b></div>
      <label class="f" style="margin-top:10px"><b>Ore di sport a settimana</b><input id="cOre" type="number" inputmode="numeric" value="${S.ore||""}" placeholder="10"></label>
      ${S.ore?`<div class="esito ${S.ore>S.prof.eta?"giallo":"verde"}"><p style="margin:0;font-size:14px;line-height:1.6">${S.ore>S.prof.eta
        ? "Fai più ore settimanali di sport organizzato di quanti anni hai. Nello studio caso-controllo questo raddoppia la probabilità di infortunio grave da sovraccarico. Vale la pena parlarne con chi ti allena e con i tuoi."
        : "Volume settimanale entro il riferimento pediatrico."}</p><p class="avv">Jayanthi et al., Am J Sports Med 2015 · Brenner e Watson, Pediatrics 2024.</p></div>`:""}
    </div>`:""}`, false);

  cont().innerHTML = h + "</div>";
  legaStrumenti(); legaSchede(); impagina();
}

function legaStrumenti() {
  const q = (s) => cont().querySelector(s), qa = (s) => cont().querySelectorAll(s);
  const g = (s) => { const e = q(s); const v = e ? parseFloat(String(e.value).replace(",", ".")) : NaN; return Number.isFinite(v) ? v : null; };

  const set = (attr, campo) => qa("[data-" + attr + "]").forEach(b => b.onclick = () => { S[campo] = b.dataset[attr]; salva(); render(); });
  const setMulti = (attr, campo) => qa("[data-" + attr + "]").forEach(b => b.onclick = () => {
    const k = b.dataset[attr], a = S[campo] || (S[campo] = []);
    const i = a.indexOf(k); if (i >= 0) a.splice(i,1); else a.push(k);
    salva(); render();
  });
  set("ob","obiettivo"); setMulti("pd","punti"); setMulti("vi","vincoli");
  qa("[data-sq]").forEach(b => b.onclick = () => { const a = S.cal.squadra, k = b.dataset.sq;
    const i = a.indexOf(k); if (i>=0) a.splice(i,1); else a.push(k); salva(); render(); });
  qa("[data-pa]").forEach(b => b.onclick = () => { const a = S.cal.palestra, k = b.dataset.pa;
    const i = a.indexOf(k); if (i>=0) a.splice(i,1); else a.push(k); salva(); render(); });
  qa("[data-pt]").forEach(b => b.onclick = () => { S.cal.partita = b.dataset.pt; salva(); render(); });
  if (q("#qRuolo")) q("#qRuolo").onchange = () => { S.ruolo = q("#qRuolo").value; salva(); };
  if (q("#qDove")) q("#qDove").onchange = () => { S.dove = q("#qDove").value; salva(); };
  if (q("#qScuola")) q("#qScuola").onchange = () => { S.cal.scuolaFino = q("#qScuola").value; salva(); };
  if (q("#qAll")) q("#qAll").onchange = () => { S.cal.oraAllenamento = q("#qAll").value; salva(); };
  if (q("#qPart")) q("#qPart").onchange = () => { S.cal.oraPartita = q("#qPart").value; salva(); };
  if (q("#qRich")) q("#qRich").oninput = () => { S.richiesta = q("#qRich").value; };
  if (q("#qVai")) q("#qVai").onclick = () => { segna("btn:genera-piano"); S.richiesta = q("#qRich") ? q("#qRich").value : S.richiesta; salva(); generaPiano(); };
  if (q("#qRif")) q("#qRif").onclick = () => { segna("btn:rifai-piano"); generaPiano(); };
  if (q("#qPdf")) q("#qPdf").onclick = () => segna("btn:pdf-piano") || pdfPiano2().catch(() => toast("Non sono riuscito a creare il PDF"));

  if (q("#mSalva")) q("#mSalva").onclick = () => {
    const cm = g("#mCm"), kg = g("#mKg");
    if (!ok(cm,100,220) || !ok(kg,25,150)) { toast("Statura e peso devono essere plausibili"); return; }
    S.prof.cm = cm; S.prof.kg = kg; S.prof.cmSeduto = g("#mSed"); S.prof.sesso = q("#mSesso").value;
    salva(); render(); toast("Misure salvate");
  };
  if (q("#mCanc")) q("#mCanc").onclick = () => { S.prof.cm = S.prof.kg = S.prof.cmSeduto = null; S.misure = []; S.punti = []; S.piano = null; S.pianoAl = null; salva(); render(); toast("Misure, punti deboli e piano cancellati"); };
  if (q("#mAdd")) q("#mAdd").onclick = () => { S.misure.push({ data: new Date().toISOString().slice(0,10), statura: S.prof.cm }); salva(); render(); toast("Misura aggiunta"); };
  if (q("#mReset")) q("#mReset").onclick = () => { S.misure = []; salva(); render(); };

  if (q("#rAdd")) q("#rAdd").onclick = () => {
    const m = (q("#rM").value || "").trim(), e = q("#rD").value, oggi = isoData(new Date());
    if (!m) { toast("Metti la materia"); return; }
    if (!e) { toast("Metti il giorno della prova"); return; }
    const p = pianoRipassi(traGiorni(oggi, e));
    if (!p) { toast("La prova deve essere fra almeno due giorni"); return; }
    S.ripassi = S.ripassi || [];
    S.ripassi = S.ripassi.filter(x => x.m.toLowerCase() !== m.toLowerCase());
    segna("btn:calcola-ripassi");
    S.ripassi.push({ m, e, d: p.giorni.map(n => piuGiorni(oggi, n)) });
    salva(); render(); toast(p.giorni.length + " ripassi in calendario");
  };
  qa("[data-rx]").forEach(b => b.onclick = () => { S.ripassi.splice(Number(b.dataset.rx), 1); salva(); render(); });

  qa("[data-t]").forEach(b => b.onclick = () => {
    segna("btn:triage");
    TRI[b.dataset.t] = !TRI[b.dataset.t];
    const r = triage(TRI);
    const attivi = Object.values(TRI).some(Boolean);
    b.classList.toggle("on", !!TRI[b.dataset.t]);
    q("#triOut").innerHTML = attivi ? `<div class="esito ${r.cls}"><h3>${r.titolo}</h3>
      <p style="margin:0 0 10px;font-size:14.5px;line-height:1.6">${r.fare}</p>
      <div class="blocco"><div class="t"><b>Cosa non fare</b></div>${r.nonFare.map(x=>`<div class="riga"><div class="n">${x}</div></div>`).join("")}</div>
      <p class="avv">Paediatric Musculoskeletal Matters, Newcastle University · Schroeder et al., Am Fam Physician 2024.</p></div>` : "";
  });

  qa("[data-g]").forEach(b => b.onclick = () => { S.tipo = b.dataset.g; salva(); render(); });
  qa("[data-l]").forEach(b => b.onclick = () => { S.liv = b.dataset.l; salva(); render(); });
  qa("[data-s]").forEach(b => b.onclick = () => { S.sedute = Number(b.dataset.s); salva(); render(); });
  if (q("#nVar")) q("#nVar").onclick = () => { S.variante++; salva(); render(); toast("Alimenti cambiati"); };
  if (q("#nPdf")) q("#nPdf").onclick = () => segna("btn:pdf-alimentare") || pdfPiano().catch(() => toast("Non sono riuscito a creare il PDF"));
  if (q("#sPdf")) q("#sPdf").onclick = () => segna("btn:pdf-allenamento") || pdfScheda().catch(() => toast("Non sono riuscito a creare il PDF"));

  if (q("#cAdd")) q("#cAdd").onclick = () => {
    const ua = caricoSessione(g("#cR"), g("#cM"));
    if (ua === null) { toast("Sforzo da 0 a 10 e minuti"); return; }
    const t = g("#cT"), voce = { d: new Date().toISOString().slice(0,10), ua };
    if (ok(t,0,10)) voce.m = t;
    segna("btn:registra-seduta");
    S.carichi.push(voce); salva(); render(); toast("Seduta registrata");
  };
  if (q("#cReset")) q("#cReset").onclick = () => { S.carichi = []; salva(); render(); };
  if (q("#cOre")) q("#cOre").onchange = () => { S.ore = g("#cOre"); salva(); render(); };
}

/* ---------------- render principale ---------------- */
function render() {
  if (!S.prof.eta) { setup(); return; }
  const v = V[attiva];
  document.documentElement.style.setProperty("--acc", v.acc);
  $("#num").innerHTML = segno(v.k); $("#titolo").textContent = v.t; $("#tagline").textContent = v.tag;
  /* La nota mostra sempre il suo titolo per intero e tiene il resto
     dentro: prima si leggeva mezza frase e i puntini. */
  $("#notaT").textContent = v.notaT || "Come leggere questa sezione";
  $("#notaC").textContent = v.nota;
  $("#notaW").classList.remove("hide");
  $("#nota").open = !!noteAperte[attiva];
  $("#esci").classList.remove("hide"); $("#esci").textContent = S.prof.nome || "Esci";
  $("#profilo").textContent = S.prof.nome || "Esci";
  $("#lato").classList.remove("hide");
  const chatMode = attiva !== "strumenti" && attiva !== "oggi";
  $(".app").dataset.vista = chatMode ? "chat" : "pannello";
  $("#ask").classList.toggle("hide", !chatMode);
  if (chatMode) { renderVoce(v); $("#input").placeholder = "Chiedi a " + v.t; }
  else if (attiva === "oggi") renderOggi();
  else renderStrumenti();
  renderTabs();
  /* la transizione parte solo cambiando sezione, non a ogni tocco */
  if (ultimaSez !== attiva) { const c = cont(); c.classList.remove("fade"); void c.offsetWidth; c.classList.add("fade"); ultimaSez = attiva; }
  requestAnimationFrame(() => { const b = $("#body"); if (chatMode && (chat[attiva]||[]).length) b.scrollTop = b.scrollHeight; });
}

/* ---------------- avvio ---------------- */
$("#nota").addEventListener("toggle", () => { noteAperte[attiva] = $("#nota").open; });
document.querySelectorAll("[data-marchio]").forEach(el => el.onclick = () => {
  clearTimeout(tocchiT); tocchi++;
  tocchiT = setTimeout(() => { tocchi = 0; }, 900);
  if (tocchi >= 5) { tocchi = 0; if (!$("#dev")) pannelloDev(); }
});
$("#go").onclick = () => invia($("#input").value);
$("#input").addEventListener("input", autosize);
$("#input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); invia($("#input").value); } });
const azzera = () => {
  if (!confirm("Cancello profilo, misure, registrazioni e conteggi da questo dispositivo?")) return;
  S = JSON.parse(JSON.stringify(VUOTO));
  try { localStorage.removeItem(CHIAVE); } catch (e) {}
  Object.keys(chat).forEach(k => delete chat[k]); TRI = {};
  selGiorno = null; ultimaSez = null; attiva = "oggi";
  render();
};
$("#esci").onclick = azzera;      /* testata del telefono */
$("#profilo").onclick = azzera;   /* fondo della colonna di sinistra */

render();
carica().then(render);
usa("sample").then(s => { SAMPLE = s; });
</script>

</body></html>
